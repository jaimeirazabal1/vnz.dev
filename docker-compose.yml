# =============================================
# vnz.dev - Local Development Stack
# PostgreSQL + Next.js App (hot-reload)
# =============================================
#
# Usage:
#   docker compose up              # Start all services
#   docker compose up -d           # Start in background
#   docker compose down            # Stop all services
#   docker compose logs -f app     # Follow app logs
#   docker compose exec app bash   # Shell into app container
#   docker compose down -v         # Stop + delete volumes (fresh DB)
#
# The app will be available at http://localhost:3000
# PostgreSQL will be available at localhost:5432
#

services:
  # =============================================
  # PostgreSQL Database
  # Schema applied automatically on first run
  # =============================================
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vnzdev
      POSTGRES_PASSWORD: vnzdev_local_2024
      POSTGRES_DB: vnzdev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnzdev -d vnzdev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =============================================
  # Next.js Application
  # Hot-reload via volume mount
  # =============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=placeholder-use-env-local
      - DATABASE_URL=postgresql://vnzdev:vnzdev_local_2024@db:5432/vnzdev
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
